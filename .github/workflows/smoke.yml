name: Smoke - carrier V2

# Suite minima @P1 para feedback rapido en PRs y nightly.
on:
  pull_request:
    paths:
      - 'tests/**'
      - 'playwright.config.ts'
      - 'global-setup.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
      - '.github/actions/**'
  push:
    branches:
      - 'carrier-v2/**'
      - 'infra/**'
      - 'analysis/**'
  schedule:
    - cron: '30 11 * * 1-5' # lun-vie 08:30 ART (11:30 UTC) - servidores ya encendidos
  workflow_dispatch:
    inputs:
      grep:
        description: 'Patron --grep (default @P1)'
        required: false
        default: '@P1'
        type: string

jobs:
  # Ventana operativa: los runs automaticos (schedule, push, PR) solo arrancan de lunes a viernes,
  # 07:00-19:00 ART. El cron ya filtra dias, pero GitHub demora los schedule hasta horas (2026-11-02:
  # cron de 11:30 UTC arranco 20:50 UTC), asi que se valida la hora real de arranque. Un
  # workflow_dispatch (manual) no se filtra. TZ=ART3 = UTC-3 fijo (AR sin horario de verano), sin tzdata.
  schedule-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.window.outputs.run }}
    steps:
      - id: window
        env:
          EVENT: ${{ github.event_name }}
        run: |
          DOW=$(TZ=ART3 date +%u)
          HOUR=$(TZ=ART3 date +%-H)
          if [ "$EVENT" = "workflow_dispatch" ] || { [ "$DOW" -le 5 ] && [ "$HOUR" -ge 7 ] && [ "$HOUR" -lt 19 ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Fuera de la ventana lun-vie 07:00-19:00 ART (dia $DOW, hora $HOUR): run omitido"
          fi

  # Gate barato (~1 min) que evita correr la suite si lint/typecheck rompe.
  quality-checks:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pw
        with:
          install-browsers: 'false'
      - run: npm run lint
      - run: npm run typecheck

  smoke-test:
    needs: quality-checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Environment TEST expone vars (BASE_URL, LOGIN_PATH) y secrets
    # (USER_CARRIER_AR, PASS_CARRIER_AR) configurados desde GitHub UI.
    environment: TEST
    env:
      ENV: test
      CI: 'true'
      HEADLESS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pw

      - name: Run smoke specs (@P1 por defecto, override via dispatch input)
        env:
          # Variables publicas del environment TEST.
          BASE_URL: ${{ vars.BASE_URL }}
          LOGIN_PATH: ${{ vars.LOGIN_PATH }}
          # Primaria: US (carrier EEUU). global-setup usa USER_CARRIER/PASS_CARRIER sin sufijo.
          USER_CARRIER: ${{ secrets.USER_CARRIER_US }}
          PASS_CARRIER: ${{ secrets.PASS_CARRIER_US }}
          # Regiones disponibles para specs parametrizados (resolveCredentials('US'|'AR'|...)).
          # Reglas financieras (simbolo moneda + separadores) varian por carrier; idioma EN/ES estable.
          USER_CARRIER_US: ${{ secrets.USER_CARRIER_US }}
          PASS_CARRIER_US: ${{ secrets.PASS_CARRIER_US }}
          USER_CARRIER_AR: ${{ secrets.USER_CARRIER_AR }}
          PASS_CARRIER_AR: ${{ secrets.PASS_CARRIER_AR }}
          # global-setup loguea AR y guarda storage/state-carrier-ar-test.json: lo consume
          # carrierRegionFixture (specs de unidades MG-1189/1190/1193, carrier metrico 1040).
          REGION_SESSIONS: AR
          # Cuando exista carrier FR, agregar:
          # USER_CARRIER_FR: ${{ secrets.USER_CARRIER_FR }}
          # PASS_CARRIER_FR: ${{ secrets.PASS_CARRIER_FR }}
        # Smoke = @P1 funcional. Excluye @visual (corre en visual.yml con baseline propio)
        # y --testIgnore del project en playwright.config.ts si fuera necesario.
        run: npx playwright test --grep "${{ inputs.grep || '@P1' }}" --grep-invert "@visual" --project=carrier-v2-desktop

      # FW-015: dashboard HTML consolidado de la corrida (sin deps). Se incluye en el artifact.
      - name: Generate dashboard (FW-015)
        if: always()
        run: node scripts/generate-dashboard.cjs evidence/test/results.json

      - uses: actions/upload-artifact@v4
        if: always()
        # Un corte del servicio de artifacts de GitHub (2026-11-11, run 43094155204: smoke verde y
        # job rojo por CreateArtifact 5xx) no debe marcar la suite como fallida: el resultado de los
        # tests lo decide el step de Playwright.
        continue-on-error: true
        with:
          name: smoke-test-report
          path: evidence/test/
          retention-days: 7

      - name: Validate Teams webhook secret
        if: always()
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          if [ -z "${TEAMS_WEBHOOK_URL:-}" ]; then
            echo "TEAMS_WEBHOOK_URL missing in environment TEST"
            exit 1
          fi
          echo "TEAMS_WEBHOOK_URL available"

      - name: Notify Teams (resultado del run)
        if: always()
        continue-on-error: true
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          PROJECT: carrier-v2-e2e
          SUITE: smoke
          JOB_STATUS: ${{ job.status }}
        run: bash scripts/notify-teams.sh
