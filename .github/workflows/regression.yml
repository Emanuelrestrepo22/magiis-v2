name: Regression - carrier V2

# Suite completa funcional. Por ahora solo corre en TEST.
# UAT esta documentado abajo (comentado) y se activara cuando RRHH/DevOps
# configuren el environment UAT en GitHub con sus vars + secrets.
on:
  schedule:
    - cron: '45 11 * * 1-5' # lun-vie 08:45 ART (11:45 UTC) - escalonado tras smoke
  workflow_dispatch:
    inputs:
      shards:
        description: 'Cantidad de shards en paralelo (1 = sin sharding)'
        required: false
        default: '4'
        type: string
      xray_execution:
        description: 'Xray: key del Test Execution (ATR) destino. Vacío = crea uno nuevo.'
        required: false
        default: ''
      xray_version:
        description: 'Xray: fixVersion para la ejecución nueva (si xray_execution vacío)'
        required: false
        default: ''

jobs:
  # Ventana operativa: los runs automaticos (schedule, push, PR) solo arrancan de lunes a viernes,
  # 07:00-19:00 ART. El cron ya filtra dias, pero GitHub demora los schedule hasta horas (2026-11-02:
  # cron de 11:30 UTC arranco 20:50 UTC), asi que se valida la hora real de arranque. Un
  # workflow_dispatch (manual) no se filtra. TZ=ART3 = UTC-3 fijo (AR sin horario de verano), sin tzdata.
  schedule-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.window.outputs.run }}
    steps:
      - id: window
        env:
          EVENT: ${{ github.event_name }}
        run: |
          DOW=$(TZ=ART3 date +%u)
          HOUR=$(TZ=ART3 date +%-H)
          if [ "$EVENT" = "workflow_dispatch" ] || { [ "$DOW" -le 5 ] && [ "$HOUR" -ge 7 ] && [ "$HOUR" -lt 19 ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Fuera de la ventana lun-vie 07:00-19:00 ART (dia $DOW, hora $HOUR): run omitido"
          fi

  quality-checks:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pw
        with:
          install-browsers: 'false'
      - run: npm run lint
      - run: npm run typecheck

  regression-test:
    needs: quality-checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Environment TEST expone vars (BASE_URL, LOGIN_PATH) y secrets
    # (USER_CARRIER_AR, PASS_CARRIER_AR) configurados desde GitHub UI.
    environment: TEST
    strategy:
      fail-fast: false
      # Sharding 4-way reduce ~90 min secuencial a ~25 min (4 shards paralelos).
      # Cada shard ejecuta globalSetup (auth carrier) independiente.
      matrix:
        shard: [1, 2, 3, 4]
    env:
      ENV: test
      CI: 'true'
      HEADLESS: 'true'
      TOTAL_SHARDS: '4'
      # HAS_XRAY habilita el reporter (los secrets no van directo en `if:`).
      HAS_XRAY: ${{ secrets.XRAY_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pw

      - name: Run regression shard ${{ matrix.shard }}/${{ env.TOTAL_SHARDS }} (excluye @visual)
        env:
          # Variables publicas del environment TEST.
          BASE_URL: ${{ vars.BASE_URL }}
          LOGIN_PATH: ${{ vars.LOGIN_PATH }}
          # XRAY=1 activa el xray-reporter → cada shard emite evidence/test/xray-results.json
          XRAY: ${{ env.HAS_XRAY == 'true' && '1' || '' }}
          # Primaria: US (carrier EEUU). global-setup usa USER_CARRIER/PASS_CARRIER sin sufijo.
          USER_CARRIER: ${{ secrets.USER_CARRIER_US }}
          PASS_CARRIER: ${{ secrets.PASS_CARRIER_US }}
          # Regiones disponibles para specs parametrizados (resolveCredentials('US'|'AR'|...)).
          USER_CARRIER_US: ${{ secrets.USER_CARRIER_US }}
          PASS_CARRIER_US: ${{ secrets.PASS_CARRIER_US }}
          USER_CARRIER_AR: ${{ secrets.USER_CARRIER_AR }}
          PASS_CARRIER_AR: ${{ secrets.PASS_CARRIER_AR }}
          # global-setup loguea AR y guarda storage/state-carrier-ar-test.json: lo consume
          # carrierRegionFixture (specs de unidades MG-1189/1190/1193, carrier metrico 1040).
          REGION_SESSIONS: AR
          # Cuando exista carrier FR, agregar:
          # USER_CARRIER_FR: ${{ secrets.USER_CARRIER_FR }}
          # PASS_CARRIER_FR: ${{ secrets.PASS_CARRIER_FR }}
        # --project explicito: excluye 'codegen' (sesion sin auth) y 'visual'.
        # Sin pin, regression heredaba todos los projects y corria la suite bajo
        # [codegen] sin login -> ~72 fallos espurios. Mantiene cobertura dual-viewport.
        # @e2e tambien queda excluido: esos specs (new-trip-happy-path, new-trip-route-flags,
        # new-trip-frequent-destination) crean viajes reales en el entorno sin limpieza
        # automatica (~49 viajes acumulados pendientes de cancelacion manual); se corren
        # a demanda con MG682_CREATE_TRIP=1, nunca en CI agendado. (new-trip-happy-path ya
        # limpia lo que crea y corre siempre; su gate MG19_CREATE_TRIP fue retirado el 2026-09-30.)
        # @db: oraculos contra Oracle (ORACLE_*_TEST + red interna), inalcanzables desde un runner
        # hosteado de GitHub; corren local o en el CI interno. @explore: discovery, no regresion.
        run: npx playwright test --grep-invert "@visual|@e2e|@db|@explore" --project=carrier-v2-desktop --project=carrier-v2-laptop --shard=${{ matrix.shard }}/${{ env.TOTAL_SHARDS }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # Reportes por shard para poder reconciliar JUnit si se necesita un agregado.
          name: regression-test-report-shard-${{ matrix.shard }}
          path: evidence/test/
          retention-days: 14

      - name: Validate Teams webhook secret
        if: always()
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          if [ -z "${TEAMS_WEBHOOK_URL:-}" ]; then
            echo "TEAMS_WEBHOOK_URL missing in environment TEST"
            exit 1
          fi
          echo "TEAMS_WEBHOOK_URL available"

      - name: Notify Teams (resultado del shard)
        if: always()
        continue-on-error: true
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          PROJECT: carrier-v2-e2e
          SUITE: regression-shard-${{ matrix.shard }}
          JOB_STATUS: ${{ job.status }}
        run: bash scripts/notify-teams.sh

  # ============================================================
  # Xray import — mergea los N shards y hace UN solo import.
  # Inerte hasta que exista secrets.XRAY_CLIENT_ID (HAS_XRAY=false → steps skip).
  # ============================================================
  xray-import:
    needs: regression-test
    if: ${{ always() && needs.regression-test.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: TEST
    env:
      HAS_XRAY: ${{ secrets.XRAY_CLIENT_ID != '' }}
      XRAY_CLIENT_ID: ${{ secrets.XRAY_CLIENT_ID }}
      XRAY_CLIENT_SECRET: ${{ secrets.XRAY_CLIENT_SECRET }}
      XRAY_EXECUTION_KEY: ${{ inputs.xray_execution }}
      XRAY_VERSION: ${{ inputs.xray_version }}
    steps:
      - name: Download shard artifacts
        if: ${{ env.HAS_XRAY == 'true' }}
        uses: actions/download-artifact@v4
        with:
          pattern: regression-test-report-shard-*
          path: shard-artifacts
      - name: Merge shards + import to Xray Cloud
        if: ${{ env.HAS_XRAY == 'true' }}
        run: |
          set -e
          mapfile -t FILES < <(find shard-artifacts -name xray-results.json 2>/dev/null || true)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "⚠️  Sin xray-results.json en los shards (¿XRAY off o 0 tests mapeados?). Skip."
            exit 0
          fi
          echo "🧬 Merge de ${#FILES[@]} shard(s)"
          MERGED=$(jq -s '{ tests: (map(.tests) | add) }' "${FILES[@]}")
          if [ -n "${XRAY_EXECUTION_KEY}" ]; then
            PAYLOAD=$(echo "$MERGED" | jq --arg k "$XRAY_EXECUTION_KEY" '. + { testExecutionKey: $k }')
          else
            SUMMARY="Regression carrier-v2 — run #${{ github.run_number }}"
            PAYLOAD=$(echo "$MERGED" | jq --arg s "$SUMMARY" --arg v "$XRAY_VERSION" \
              '. + { info: ({ summary: $s } + (if $v != "" then { version: $v } else {} end)) }')
          fi
          echo "$PAYLOAD" > xray-merged.json
          echo "📤 Importando $(echo "$PAYLOAD" | jq '.tests | length') resultado(s)..."
          TOKEN=$(curl -sf -H "Content-Type: application/json" -X POST \
            --data "{\"client_id\":\"${XRAY_CLIENT_ID}\",\"client_secret\":\"${XRAY_CLIENT_SECRET}\"}" \
            https://xray.cloud.getxray.app/api/v2/authenticate | tr -d '"')
          [ -n "$TOKEN" ] || { echo "❌ auth Xray falló"; exit 1; }
          HTTP=$(curl -s -o resp.json -w "%{http_code}" -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN" -X POST --data @xray-merged.json \
            https://xray.cloud.getxray.app/api/v2/import/execution)
          echo "HTTP ${HTTP}:"; cat resp.json; echo
          [ "$HTTP" = "200" ] || { echo "❌ import devolvió ${HTTP}"; exit 1; }
          echo "✅ Import OK."
      - name: Upload merged payload
        if: ${{ always() && env.HAS_XRAY == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: xray-merged-${{ github.run_number }}
          path: |
            xray-merged.json
            resp.json
          retention-days: 14

  # ============================================================
  # Job UAT pendiente de activacion.
  # ============================================================
  # Bloqueado hasta que se configure el environment UAT en GitHub con:
  #   vars:   BASE_URL, LOGIN_PATH
  #   secrets: USER_CARRIER_AR, PASS_CARRIER_AR  (o equivalente UAT)
  # Cuando esten cargadas, descomentar este job y opcionalmente
  # agregarlo al schedule (o dejarlo solo en workflow_dispatch).
  # Replica el patron de sharding 4-way del job TEST.
  # ------------------------------------------------------------
