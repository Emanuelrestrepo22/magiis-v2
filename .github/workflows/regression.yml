  #     - uses: actions/checkout@v4
  #     - uses: ./.github/actions/setup-pw
  #     - name: Run regression UAT shard ${{ matrix.shard }}/${{ env.TOTAL_SHARDS }} (excluye @visual)
  #       env:
  #         BASE_URL: ${{ vars.BASE_URL }}
  #         LOGIN_PATH: ${{ vars.LOGIN_PATH }}
  #         USER_CARRIER: ${{ secrets.USER_CARRIER_AR }}
  #         PASS_CARRIER: ${{ secrets.PASS_CARRIER_AR }}
